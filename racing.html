<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Racing Game</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h2 {
  margin: 12px 0 5px;
}

#score {
  font-size: 20px;
  margin-bottom: 8px;
}

#game {
  position: relative;
  margin: auto;
  width: min(94vw, 360px);
  height: 70vh;
  max-height: 620px;
  min-height: 400px;
  background: #333;
  border: 4px solid #555;
  overflow: hidden;
}

.road {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    90deg,
    #222 0%,
    #333 20%,
    #333 80%,
    #222 100%
  );
}

.line {
  position: absolute;
  width: 8px;
  height: 70px;
  background: #eee;
  left: calc(50% - 4px);
  animation: road 0.7s linear infinite;
}

@keyframes road {
  from {
    top: -80px;
  }
  to {
    top: 100%;
  }
}

.car {
  position: absolute;
  width: 42px;
  height: 70px;
  border-radius: 9px;
  z-index: 3;
}

#player {
  bottom: 20px;
  left: calc(50% - 21px);
  background: #1683ff;
  border: 3px solid #9dd2ff;
}

#player::after {
  content: "";
  position: absolute;
  top: 10px;
  left: 7px;
  width: 22px;
  height: 18px;
  background: #bde5ff;
  border-radius: 4px;
}

.enemy {
  background: #e53935;
  border: 3px solid #ff9b9b;
}

.enemy::after {
  content: "";
  position: absolute;
  top: 10px;
  left: 7px;
  width: 22px;
  height: 18px;
  background: #ffd1d1;
  border-radius: 4px;
}

#controls {
  margin: 12px auto;
  display: flex;
  justify-content: center;
  gap: 25px;
}

button {
  font-size: 25px;
  padding: 12px 28px;
  border: 0;
  border-radius: 12px;
  background: #1683ff;
  color: white;
}

#start {
  font-size: 18px;
  padding: 10px 25px;
  margin-bottom: 10px;
}

#over {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  z-index: 5;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

#over h1 {
  color: #ff5555;
}
</style>
</head>

<body>

<h2>🏎️ Car Racing</h2>

<div id="score">Score: 0</div>

<div id="game">

  <div class="road"></div>

  <div class="line" style="top:0"></div>
  <div class="line" style="top:180px"></div>
  <div class="line" style="top:360px"></div>

  <div id="player" class="car"></div>

  <div id="over">
    <h1>GAME OVER</h1>
    <p id="finalScore">Score: 0</p>
    <button onclick="restart()">আবার খেলুন</button>
  </div>

</div>

<div id="controls">
  <button onclick="move(-1)">⬅️</button>
  <button onclick="move(1)">➡️</button>
</div>

<button id="start" onclick="startGame()">গেম শুরু করুন</button>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");
const over = document.getElementById("over");
const finalScore = document.getElementById("finalScore");

let x = 50;
let score = 0;
let running = false;
let enemies = [];
let timer;

function move(dir) {
  if (!running) return;

  x = Math.max(8, Math.min(92, x + dir * 12));
  player.style.left = `calc(${x}% - 21px)`;
}

function startGame() {
  if (running) return;

  running = true;
  score = 0;
  x = 50;

  player.style.left = `calc(50% - 21px)`;
  over.style.display = "none";
  document.getElementById("start").style.display = "none";

  requestAnimationFrame(loop);
}
