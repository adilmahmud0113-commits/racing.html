<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #70c5ce;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }
        canvas {
            border: 2px solid #000;
            background-color: #70c5ce;
        }
    </style>
</head>
<body>

<canvas id="birdCanvas" width="320" height="480"></canvas>

<script>
const canvas = document.getElementById("birdCanvas");
const ctx = canvas.getContext("2d");

let frames = 0;
let score = 0;
let gameOver = false;

const bird = {
    x: 50,
    y: 150,
    w: 20,
    h: 20,
    gravity: 0.25,
    jump: 4.6,
    velocity: 0,
    
    draw: function() {
        ctx.fillStyle = "yellow";
        ctx.fillRect(this.x, this.y, this.w, this.h);
    },
    
    flap: function() {
        this.velocity = -this.jump;
    },
    
    update: function() {
        this.velocity += this.gravity;
        this.y += this.velocity;
        
        if (this.y + this.h >= canvas.height) {
            this.y = canvas.height - this.h;
            gameOver = true;
        }
    }
};

const pipes = {
    position: [],
    w: 40,
    gap: 100,
    dx: 2,
    
    draw: function() {
        ctx.fillStyle = "green";
        for (let i = 0; i < this.position.length; i++) {
            let p = this.position[i];
            let topYPos = p.y;
            let bottomYPos = p.y + this.gap;
            
            ctx.fillRect(p.x, 0, this.w, topYPos);
            ctx.fillRect(p.x, bottomYPos, this.w, canvas.height - bottomYPos);
        }
    },
    
    update: function() {
        if (frames % 100 === 0) {
            this.position.push({
                x: canvas.width,
                y: Math.floor(Math.random() * (canvas.height - 200)) + 50
            });
        }
        
        for (let i = 0; i < this.position.length; i++) {
            let p = this.position[i];
            p.x -= this.dx;
            
            if (bird.x + bird.w > p.x && bird.x < p.x + this.w &&
               (bird.y < p.y || bird.y + bird.h > p.y + this.gap)) {
                gameOver = true;
            }
            
            if (p.x + this.w < bird.x && !p.passed) {
                score++;
                p.passed = true;
            }
            
            if (p.x + this.w <= 0) {
                this.position.shift();
            }
        }
    }
};

function handleAction() {
    if (gameOver) {
        bird.y = 150;
        bird.velocity = 0;
        pipes.position = [];
        score = 0;
        gameOver = false;
        loop();
    } else {
        bird.flap();
    }
}

document.addEventListener("keydown", function(e) {
    if (e.code === "Space") {
        handleAction();
    }
});

canvas.addEventListener("touchstart", function(e) {
    e.preventDefault();
    handleAction();
});

function loop() {
    bird.update();
    pipes.update();
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    bird.draw();
    pipes.draw();
    
    ctx.fillStyle = "#FFF";
    ctx.font = "25px Arial";
    ctx.fillText("Score: " + score, 10, 30);
    
    frames++;
    
    if (!gameOver) {
        requestAnimationFrame(loop);
    } else {
        ctx.fillStyle = "red";
        ctx.font = "30px Arial";
        ctx.fillText("Game Over", 80, 240);
        ctx.font = "16px Arial";
        ctx.fillText("Tap/Space to Restart", 80, 280);
    }
}

loop();
</script>

</body>
</html>
